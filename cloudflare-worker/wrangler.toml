# ============================================================================
# ANNE TMAIL - Cloudflare Email Worker
# ============================================================================
name = "anne-tmail-worker"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ----------------------------------------------------------------------------
# Email Routing: panggil worker ini sebagai destination catch-all.
# Aktifkan dulu Email Routing di dashboard Cloudflare, lalu arahkan
# catch-all ke worker ini (Workers > Email Routing > Catch-all > Action:
# "Send to Worker"). `wrangler deploy` akan mendaftarkan handler email()
# otomatis bila Email Routing sudah aktif.
# ----------------------------------------------------------------------------
[observability]
enabled = true

# ----------------------------------------------------------------------------
# Non-secret vars (aman di-commit). Secret gunakan:
#   wrangler secret put SUPABASE_SERVICE_ROLE_KEY
# ----------------------------------------------------------------------------
[vars]
SUPABASE_URL = "https://gypzdlwlbcuytvvmgeva.supabase.co"
MAX_ATTACHMENTS = "5"
MAX_ATTACHMENT_BYTES = "10485760"   # 10 MB per lampiran